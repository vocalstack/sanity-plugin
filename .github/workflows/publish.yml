# Publishes the package to npm when main carries a version npm does not have yet:
# bump `version` in package.json, push to main, and this tags v<version>, publishes
# it and makes the GitHub release. A published GitHub release (tag v<version>) or a
# manual run publishes too, and a version already on npm is skipped.
# npm trusts this repository, this workflow and the `npm` environment (trusted
# publishing), so there is no token. A prerelease version (0.3.0-beta.1) goes to
# the `next` dist-tag, everything else to `latest`.

name: publish

on:
  push:
    branches: [main]
    paths: [package.json]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # tag + GitHub release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: version
        id: v
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::release ${GITHUB_REF_NAME} does not match package.json version $version (want v$version)"; exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: install + build + test
        if: steps.v.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: npm publish
        if: steps.v.outputs.publish == 'true'
        run: |
          case "${{ steps.v.outputs.version }}" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --access public --provenance --tag "$tag"
      - name: tag + GitHub release
        if: steps.v.outputs.publish == 'true' && github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.v.outputs.version }}"
          if ! gh release view "$v" >/dev/null 2>&1; then
            case "$v" in *-*) pre=--prerelease ;; *) pre= ;; esac
            gh release create "$v" --target "$GITHUB_SHA" --title "$v" --generate-notes $pre
          fi
